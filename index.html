<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Первая помощь - Тестовые вопросы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; position: relative; }

        /* Фон с размытием 30% */
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('back.png'); /* Вернули .png */
            background-size: cover; background-position: center;
            filter: blur(10px); z-index: -2;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: -1; }
        .container { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }

        /* Область посередине - еще более размытая */
        .content-box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 20px; padding: 60px 80px; max-width: 800px; width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.18); position: relative;
        }

        .welcome-screen { text-align: center; }
        .welcome-screen h1 { font-size: 48px; color: white; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); }
        .welcome-screen h2 { font-size: 24px; color: rgba(255, 255, 255, 0.9); margin-bottom: 40px; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); }
        
        .btn {
            padding: 15px 40px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer;
            transition: all 0.3s; font-weight: 600; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); }
        .btn-primary:active { transform: translateY(0); }

        .test-screen { display: none; }
        .question-text { font-size: 20px; color: white; margin-bottom: 30px; line-height: 1.6; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); font-weight: 500; }
        .answers { margin-bottom: 30px; }
        
        /* Плитки ответов */
        .answer-option {
            background: rgba(235, 238, 242, 0.85); /* Нежный, слегка прозрачный светло-серый оттенок */
            padding: 15px 20px; margin-bottom: 12px; border-radius: 10px;
            cursor: pointer; transition: all 0.2s; 
            color: #1f2937; /* Мягкий темно-серый цвет текста, приятный для чтения */
            font-size: 16px; 
            font-weight: 500; 
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08); /* Очень легкая, почти невесомая тень */
        }
        
        .answer-option:hover { 
            background: rgba(226, 232, 240, 0.95); /* Чуть более плотный матовый оттенок при наведении */
            border-color: rgba(203, 213, 225, 0.6); 
        }
        
        /* Эффект вдавливания выбранного ответа */
        .answer-option.selected {
            background: rgba(99, 102, 241, 0.85); /* Спокойный, мягкий оттенок синего (индиго) */
            border-color: rgba(165, 180, 252, 0.8);
            color: #ffffff; 
            transform: scale(0.98); 
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2); 
        }

        .navigation { display: flex; justify-content: center; gap: 20px; }
        .btn-nav {
            padding: 12px 30px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer;
            transition: all 0.3s; font-weight: 600; background: rgba(255, 255, 255, 0.3); color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-nav:hover:not(:disabled) { background: rgba(255, 255, 255, 0.4); transform: translateY(-2px); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }

        .results-screen { display: none; text-align: center; }
        .score { font-size: 64px; color: white; margin-bottom: 40px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); font-weight: bold; }
        .results-buttons { display: flex; justify-content: center; gap: 20px; }

        .answers-table-screen { display: none; text-align: center; }
        .answers-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-bottom: 30px; }
        .answer-cell {
            background: rgba(255, 255, 255, 0.3); padding: 15px 10px; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; text-align: center;
        }
        .answer-cell:hover { background: rgba(255, 255, 255, 0.4); transform: scale(1.05); }
        .answer-cell-number { font-size: 16px; color: white; font-weight: bold; margin-bottom: 5px; }
        .answer-cell-letter { font-size: 14px; color: white; margin-bottom: 8px; }
        .answer-cell-icon { font-size: 20px; }
        .correct { color: #4ade80; }
        .incorrect { color: #ef4444; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(45, 45, 45, 0.95); /* Темно-серый фон окна */
            backdrop-filter: blur(20px); border-radius: 15px;
            padding: 40px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px; width: 40px; height: 40px;
            background: rgba(239, 68, 68, 0.8); border: none; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(239, 68, 68, 1); transform: scale(1.1); }
        .modal-question { 
            font-size: 18px; 
            color: #f3f4f6; /* Белый цвет для текста вопроса */ 
            margin-bottom: 25px; 
            font-weight: 600; 
            line-height: 1.6; 
        }
        .modal-answer {
            padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; 
            background: #3f3f46; /* Темно-серый фон плашек с ответами (чуть светлее фона окна) */
            color: #f3f4f6; /* Белый цвет для текста ответов */ 
            position: relative; 
            padding-left: 190px; /* УВЕЛИЧЕННЫЙ ОТСТУП, чтобы текст слева не налезал */ 
            min-height: 50px; display: flex; align-items: center;
        }
        .answer-label { position: absolute; left: 15px; font-weight: 600; font-size: 14px; line-height: 1.2; }
        .user-choice { color: #ef4444; }
        .correct-answer { color: #10b981; }
        .btn-back-results { margin-top: 20px; background: rgba(100, 116, 139, 0.6); }

        /* Плавные анимации появления и исчезновения */
        .fade-out { animation: fadeOut 0.4s forwards; }
        .fade-in { animation: fadeIn 0.4s forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
        @media (max-width: 768px) {
            /* 1. Отдельный фон для мобильной версии */
            .background {
                background-image: url('mobf.jpg');
            }

            /* 2. Чиним скролл: разрешаем всей странице прокручиваться естественно */
            body {
                height: auto; 
                overflow-y: auto; 
            }
            
            .container {
                height: auto;
                min-height: 100vh;
                padding: 15px 10px;
                align-items: flex-start; /* Карточка будет начинаться сверху, а не по центру, если контента много */
            }

            /* Снимаем ограничения высоты с карточки, пусть она растягивается по контенту */
            .content-box {
                padding: 25px 15px; 
                width: 100%; 
                max-height: none; 
                overflow: visible; 
                border-radius: 15px;
                margin-top: 10px; /* Небольшой отступ от верхнего края экрана */
            }

            /* Главный экран */
            .welcome-screen h1 { font-size: 32px; }
            .welcome-screen h2 { font-size: 18px; margin-bottom: 20px; }
            
            /* Экран с вопросами */
            .question-text {
                font-size: 16px; 
                margin-bottom: 15px;
            }
            
            .answer-option {
                padding: 12px 15px;
                margin-bottom: 8px;
                font-size: 14px; 
                line-height: 1.3;
            }
            
            /* Кнопки навигации */
            .navigation { gap: 10px; }
            .btn-nav { padding: 12px 15px; font-size: 14px; width: 100%; }
            .btn { padding: 12px 20px; font-size: 16px; }
            
            /* Сетка результатов */
            .answers-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
                margin-bottom: 20px;
            }
            
            .answer-cell { padding: 10px 5px; }
            .answer-cell-number { font-size: 14px; }
            .answer-cell-icon { font-size: 16px; }
            .score { font-size: 42px; margin-bottom: 20px; }
            .results-buttons { flex-direction: column; gap: 10px; }
            
            /* Модальное окно с подробным разбором */
            .modal-content {
                padding: 20px 15px;
                width: 95%;
                max-height: 85vh; /* Оставляем прокрутку для окна ответов, тут она работает хорошо */
            }
            
            .modal-question { font-size: 15px; margin-bottom: 15px; padding-right: 25px; }
            .modal-close { width: 30px; height: 30px; font-size: 16px; top: 10px; right: 10px; }
            
            .modal-answer {
                padding: 35px 12px 12px 12px; 
                min-height: auto;
                font-size: 13px;
            }
            
            .answer-label {
                top: 8px; 
                left: 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>

    <div class="container">
        <div class="content-box" id="mainContainer">
            
            <div class="welcome-screen" id="welcomeScreen">
                <h1>Первая помощь</h1>
                <h2>Тестовые вопросы</h2>
                <button class="btn btn-primary" onclick="startTest()">Начать тест</button>
            </div>

            <div class="test-screen" id="testScreen">
                <div class="question-text" id="questionText"></div>
                <div class="answers" id="answersContainer"></div>
                <div class="navigation">
                    <button class="btn-nav" id="prevBtn" onclick="prevQuestion()">Назад</button>
                    <button class="btn-nav" id="nextBtn" onclick="nextQuestion()">Дальше</button>
                </div>
            </div>

            <div class="results-screen" id="resultsScreen">
                <div class="score" id="scoreText">18 из 20</div>
                <div class="results-buttons">
                    <button class="btn btn-primary" onclick="restartTest()">Завершить</button>
                    <button class="btn btn-primary" onclick="showAnswersTable()">Посмотреть ответы</button>
                </div>
            </div>

            <div class="answers-table-screen" id="answersTableScreen">
                <div class="answers-grid" id="answersGrid"></div>
                <button class="btn btn-nav btn-back-results" onclick="backToResults()">Назад к результатам</button>
            </div>
        </div>
    </div>

    <div class="modal" id="answerModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-question" id="modalQuestion"></div>
            <div id="modalAnswers"></div>
        </div>
    </div>

    <script>
        // === ВСТАВЬ СЮДА ПОЛНЫЙ МАССИВ ИЗ 100 ВОПРОСОВ ===
        const allQuestions = [
  // БИЛЕТ № 1
  {
    question: "1 Во время оказания первой помощи пострадавший внезапно побледнел, перестал реагировать на окружающее. Укажите, с чего вы начнете оказывать первую помощь:",
    options: [
      "а) проверите признаки дыхания;",
      "б) откроете дыхательные пути;",
      "в) позовете помощника;",
      "г) проверите признаки сознания (потрясете пострадавшего и спросите: «Что с вами?»)."
    ],
    correct: 3
  },
  {
    question: "2 Признаками артериального кровотечения являются:",
    options: [
      "а) пульсирующая алая струя крови, быстро расплывающаяся лужа крови алого цвета, быстро пропитывающаяся кровью одежда пострадавшего;",
      "б) лужа крови диаметром более 1 метра вокруг пострадавшего;",
      "в) обильная струя крови темного цвета, сопровождающаяся резким ухудшением состояния пострадавшего;",
      "г) обильное истечение крови со всей поверхности раны."
    ],
    correct: 0
  },
  {
    question: "3 Пострадавшему с травмой груди следует придать следующее положение:",
    options: [
      "а) положение на спине с приподнятыми ногами;",
      "б) устойчивое боковое положение;",
      "в) полусидячее положение с наклоном в пораженную сторону;",
      "г) положение на спине с полусогнутыми и разведенными ногами;",
      "д) положение на животе."
    ],
    correct: 2
  },
  {
    question: "4 При неполной закупорке дыхательных путей следует выполнить следующие мероприятия первой помощи:",
    options: [
      "а) постучать основанием ладони в межлопаточную область пострадавшего для извлечения инородного тела;",
      "б) предложить пострадавшему откашляться;",
      "в) выполнить 5 резких толчков в нижнюю область живота пострадавшего;",
      "г) в этом случае мероприятия первой помощи не требуются."
    ],
    correct: 1
  },
  {
    question: "5 Выберите основные способы остановки кровотечения при ранении головы:",
    options: [
      "а) прямое давление на рану, наложение давящей повязки;",
      "б) наложение давящей повязки, пальцевое прижатие сонной артерии;",
      "в) пальцевое прижатие сонной артерии, наложение давящей повязки с использованием жгута;",
      "г) применение холода в области ранения, пальцевое прижатие сонной артерии."
    ],
    correct: 0
  },
  {
    question: "6 Признаки переохлаждения:",
    options: [
      "а) нет пульса у лодыжек;",
      "б) головокружение, мелькание мушек перед глазами;",
      "в) потеря чувствительности;",
      "г) озноб и дрожь, заторможенность и апатия, бред и галлюцинации."
    ],
    correct: 3
  },
  {
    question: "7 Укажите основную цель обзорного осмотра пострадавшего:",
    options: [
      "а) оценить его общее состояние;",
      "б) обнаружить явные признаки наружного кровотечения (прежде всего, артериального);",
      "в) попытаться обнаружить ранения различных областей тела;",
      "г) определить, нуждается ли пострадавший в оказании первой помощи."
    ],
    correct: 1
  },
  {
    question: "8 Что необходимо сделать при переохлаждении?",
    options: [
      "а) Перенести в тепло или, по крайней мере, укрыть от ветра;",
      "б) Сменить одежду на сухую и теплую или, по крайней мере снять влажную;",
      "в) Укрыть металлизированным одеялом;",
      "г) Все ответы верны."
    ],
    correct: 3
  },
  {
    question: "9 В каких ситуациях следует приступить к сердечно-легочной реанимации?",
    options: [
      "а) при отсутствии у пострадавшего сознания;",
      "б) при отсутствии у пострадавшего сознания и дыхания;",
      "в) в случае, если с момента потери сознания прошло не более 5 минут;",
      "г) при наличии у пострадавшего признаков смерти."
    ],
    correct: 1
  },
  {
    question: "10 Выбор способа переноски пострадавшего при оказании первой помощи зависит:",
    options: [
      "а) от наличия средств переноски (носилок, строп) пострадавших;",
      "б) от предполагаемой дальности переноски;",
      "в) от желания пострадавшего;",
      "г) от количества участников оказания первой помощи, их физических возможностей и характера травм."
    ],
    correct: 3
  },
  {
    question: "11 Пальцевое прижатие бедренной артерии выполняется:",
    options: [
      "а) в верхней трети бедра двумя большими пальцами рук, плотно обхватывающими бедро;",
      "б) выше места ранения на несколько сантиметров с усилием, достаточным для остановки кровотечения;",
      "в) в области выступа седалищной кости основанием ладони всем весом тела;",
      "г) в паховой области кулаком, зафиксированным второй рукой, весом тела участника оказания первой помощи."
    ],
    correct: 3
  },
  {
    question: "12 Качественные вдохи искусственного дыхания выполняются при соблюдении следующего условия:",
    options: [
      "а) максимально возможная скорость вдыхания;",
      "б) максимально возможный объем вдоха;",
      "в) качественное открытие дыхательных путей;",
      "г) качественная очистка полости рта."
    ],
    correct: 2
  },
  {
    question: "13 Переноску в одиночку на плече желательно не применять в отношении пострадавших с нижеприведенными травмами и состояниями:",
    options: [
      "а) травмы конечностей;",
      "б) травма головы;",
      "в) травмы груди и живота;",
      "г) ожоги и отморожения;",
      "д) отравления."
    ],
    correct: 2
  },
  {
    question: "14 Действия при ожогах пламенем:",
    options: [
      "а) сбить пламя, потушить горящую одежду. При наличии в зоне ожога инородных тел – удалить их в любом случае. Вскрыть ожоговые пузыри, участок ожога как можно быстрее покрыть жирной мазью и наложить тугую повязку.",
      "б) сбить пламя, потушить горящую одежду. Ожоговую поверхность обработать спиртом или другим дезинфицирующим раствором. Обработать ожоговую поверхность раствором йода либо бриллиантовой зелени, наложить стерильную повязку.",
      "в) сбить пламя, потушить горящую одежду. Снять с рук часы, браслеты и кольца, с ног – обувь. На неповрежденную кожу лить холодную воду длительно, не менее 20-30 минут. При повреждениях кожи закрыть участки повреждения чистой тканью и закрепить не тугой повязкой, охлаждать. При возможности - обильное питье."
    ],
    correct: 2
  },
  {
    question: "15 Давление на грудину при проведении сердечно-легочной реанимации взрослому пострадавшему осуществляется следующим образом:",
    options: [
      "а) кулаком одной руки;",
      "б) ладонью одной руки;",
      "в) ладонями обеих рук, помещенными крест-накрест;",
      "г) двумя взятыми в замок руками, расположенными одна над другой с выпрямленными пальцами."
    ],
    correct: 3
  },
  {
    question: "16 Переноску в пострадавшего с травмой позвоночника лучше производить:",
    options: [
      "а) волоком;",
      "б) сидя на стуле;",
      "в) вдвоем \"за руки,за ноги\";",
      "г) на жесткой ровной поверхности или специальном щите"
    ],
    correct: 3
  },
  {
    question: "17 Пальцевое прижатие подключичной артерии производится:",
    options: [
      "а) к ключице с помощью четырех пальцев с усилием, достаточным для остановки кровотечения;",
      "б) в ямке под ключицей большим пальцем к первому ребру;",
      "в) указательным и средним пальцем в ямке над ключицей строго перпендикулярно поверхности грудной клетки;",
      "г) в ямке над ключицей к первому ребру с помощью четырех пальцев."
    ],
    correct: 3

// КОНЕЦ ВТОРОЙ ЧАСТИ
// КОНЕЦ ПЕРВОЙ ЧАСТИ
        let userAnswers = [];
        let currentQuestionIndex = 0;

        // Плавное переключение экранов
        function switchScreen(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);
            
            hideEl.classList.add('fade-out');
            setTimeout(() => {
                hideEl.style.display = 'none';
                hideEl.classList.remove('fade-out');
                
                showEl.style.display = 'block';
                showEl.classList.add('fade-in');
                setTimeout(() => showEl.classList.remove('fade-in'), 400);
            }, 300); // Ждем пока закончится анимация исчезновения
        }

        function startTest() {
            // Выбираем 20 случайных вопросов
            const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
            selectedQuestions = shuffled.slice(0, 20);
            userAnswers = new Array(selectedQuestions.length).fill(null);
            currentQuestionIndex = 0;

            switchScreen('welcomeScreen', 'testScreen');
            setTimeout(loadQuestion, 300); // Загружаем вопрос, когда экран появится
        }

        function loadQuestion() {
            const q = selectedQuestions[currentQuestionIndex];
            document.getElementById('questionText').innerText = `Вопрос ${currentQuestionIndex + 1}: ${q.question}`;

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';

            q.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'answer-option';
                
                // Если пользователь уже выбирал этот ответ (при возврате назад)
                if (userAnswers[currentQuestionIndex] === index) {
                    div.classList.add('selected');
                }
                
                div.innerText = opt;
                div.onclick = () => selectOption(index);
                container.appendChild(div);
            });

            // Блокируем кнопку "Назад" на первом вопросе
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            // Меняем текст кнопки "Дальше", если вопрос последний
            document.getElementById('nextBtn').innerText = currentQuestionIndex === selectedQuestions.length - 1 ? 'Завершить тест' : 'Дальше';
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            // Снимаем выделение со всех и ставим на выбранный (эффект вдавливания через CSS)
            const options = document.querySelectorAll('.answer-option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[index].classList.add('selected');
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) {
                alert('Пожалуйста, выберите вариант ответа!');
                return;
            }

            if (currentQuestionIndex < selectedQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                finishTest();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function finishTest() {
            let correctCount = 0;
            selectedQuestions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            document.getElementById('scoreText').innerText = `${correctCount} из ${selectedQuestions.length}`;
            switchScreen('testScreen', 'resultsScreen');
        }

        function restartTest() {
            switchScreen('resultsScreen', 'welcomeScreen');
        }

        function showAnswersTable() {
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';

            const letters = ['А', 'Б', 'В', 'Г', 'Д'];

            selectedQuestions.forEach((q, i) => {
                const uAns = userAnswers[i];
                const isCorrect = uAns === q.correct;
                const letter = letters[uAns] || '-';

                const cell = document.createElement('div');
                cell.className = 'answer-cell';
                cell.onclick = () => openModal(i);

                cell.innerHTML = `
                    <div class="answer-cell-number">${i + 1}</div>
                    <div class="answer-cell-letter">${letter}</div>
                    <div class="answer-cell-icon ${isCorrect ? 'correct' : 'incorrect'}">
                        ${isCorrect ? '✅' : '❌'}
                    </div>
                `;
                grid.appendChild(cell);
            });

            switchScreen('resultsScreen', 'answersTableScreen');
        }

        function backToResults() {
            switchScreen('answersTableScreen', 'resultsScreen');
        }

        // Логика модального окна с разбором ошибок
        function openModal(index) {
            const q = selectedQuestions[index];
            const uAns = userAnswers[index];
            const cAns = q.correct;

            document.getElementById('modalQuestion').innerText = `${index + 1}. ${q.question}`;
            const modalAnswers = document.getElementById('modalAnswers');
            modalAnswers.innerHTML = '';

            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'modal-answer';
                
                let labelsHTML = '';
                
                // Если ответ совпадает с правильным (друг над другом)
                if (i === uAns && i === cAns) {
                    labelsHTML = `<span class="answer-label correct-answer">Ваш выбор<br>Правильный вариант</span>`;
                    div.style.border = '2px solid #10b981';
                } 
                // Если человек ответил неверно
                else if (i === uAns) {
                    labelsHTML = `<span class="answer-label user-choice">Ваш выбор</span>`;
                    div.style.border = '2px solid #ef4444';
                } 
                // Это правильный вариант, но человек его не выбрал
                else if (i === cAns) {
                    labelsHTML = `<span class="answer-label correct-answer">Правильный вариант</span>`;
                    div.style.border = '2px solid #10b981';
                }

                div.innerHTML = `${labelsHTML} <span>${opt}</span>`;
                modalAnswers.appendChild(div);
            });

            const modal = document.getElementById('answerModal');
            modal.style.display = 'flex';
            modal.classList.add('fade-in');
            setTimeout(() => modal.classList.remove('fade-in'), 400);
        }

        function closeModal() {
            const modal = document.getElementById('answerModal');
            modal.classList.add('fade-out');
            setTimeout(() => {
                modal.style.display = 'none';
                modal.classList.remove('fade-out');
            }, 300);
        }
    </script>
